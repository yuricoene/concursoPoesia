<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 655 368" width="100%" height="100%">
  <!-- Fundo na cor clara da paleta (#f3e6ea) -->
  <rect width="655" height="368" rx="20" fill="#f3e6ea"/>
  
  <!-- Formas abstratas em tons de vinho/bordô com opacidade -->
  <path d="M -50 180 C 20 120, 80 250, 150 368 L -50 368 Z" fill="#970747" opacity="0.12"/>
  <path d="M 655 0 C 550 50, 500 150, 655 250 Z" fill="#970747" opacity="0.15"/>
  <path d="M 420 368 C 460 250, 560 210, 655 220 L 655 368 Z" fill="#faf6f7" opacity="0.8"/>
  
  <!-- Elementos gráficos decorativos sutis -->
  <circle cx="70" cy="70" r="14" fill="none" stroke="#970747" stroke-width="2" opacity="0.25"/>
  <circle cx="100" cy="50" r="5" fill="#970747" opacity="0.2"/>
  <path d="M 520 60 Q 530 40 540 60" fill="none" stroke="#970747" stroke-width="2" opacity="0.25"/>

  <!-- Textos em Português nas cores do projeto -->
  <text x="310" y="175" text-anchor="middle" font-family="'Montserrat Alternates', sans-serif" font-size="46" font-weight="800" fill="#970747">Celebrando</text>
  <text x="310" y="212" text-anchor="middle" font-family="'Montserrat Alternates', sans-serif" font-size="15" font-weight="500" fill="#2b0914" opacity="0.8">O mistério das meias perdidas</text>

  <!-- Ilustração Vetorial de Meias (Cores: Bordô #970747 e Vinho Escuro #2b0914) -->
  <g transform="translate(470, 185) scale(0.85)">
    <!-- Meia 1 (Bordô com bolinhas) -->
    <g transform="rotate(-15, 40, 80)">
      <path d="M 20 10 L 50 10 C 50 10 50 60 55 75 C 60 90 85 105 85 120 C 85 135 70 145 50 145 C 30 145 20 130 20 115 C 20 95 30 75 20 10 Z" fill="#970747"/>
      <path d="M 20 10 L 50 10 L 50 20 L 20 20 Z" fill="#2b0914"/>
      <circle cx="35" cy="45" r="4" fill="#faf6f7"/>
      <circle cx="42" cy="70" r="4" fill="#faf6f7"/>
      <circle cx="55" cy="110" r="4" fill="#faf6f7"/>
      <circle cx="38" cy="125" r="4" fill="#faf6f7"/>
    </g>
    <!-- Meia 2 (Vinho escuro com listras) -->
    <g transform="translate(35, 10) rotate(10, 40, 80)">
      <path d="M 20 10 L 50 10 C 50 10 50 60 55 75 C 60 90 85 105 85 120 C 85 135 70 145 50 145 C 30 145 20 130 20 115 C 20 95 30 75 20 10 Z" fill="#2b0914"/>
      <path d="M 20 10 L 50 10 L 50 20 L 20 20 Z" fill="#970747"/>
      <line x1="22" y1="40" x2="48" y2="40" stroke="#970747" stroke-width="4"/>
      <line x1="23" y1="55" x2="49" y2="55" stroke="#970747" stroke-width="4"/>
      <line x1="25" y1="70" x2="52" y2="70" stroke="#970747" stroke-width="4"/>
    </g>
  </g>
</svg>
